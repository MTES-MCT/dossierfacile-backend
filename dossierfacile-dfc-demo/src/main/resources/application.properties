spring.profiles.active=
application.name=dfc-demo

#Server Configuration
server.port=${port:8092}
# The PaaS router terminates TLS: honour X-Forwarded-* so redirects and cookies use the public scheme and host
server.forward-headers-strategy=native
# Never rewrite URLs with ;jsessionid=
server.servlet.session.tracking-modes=cookie

#Database Configuration (schema.sql creates the webhook_log table if missing)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=
spring.datasource.username=
spring.datasource.password=
spring.sql.init.mode=always

#Templates
spring.thymeleaf.cache=true

# Logging
logging.level.root=info
logging.file.name=logs/dfc-demo.log

#DossierFacile Connect partner settings (see docs/dfc-demo.md)
dfc-demo.server-base-url=
dfc-demo.sso-base-url=
dfc-demo.api-base-url=
dfc-demo.client-id=
dfc-demo.client-secret=
dfc-demo.webhook-api-key=
