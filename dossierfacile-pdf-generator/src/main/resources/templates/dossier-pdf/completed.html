<?xml version="1.0" encoding="UTF-8"?>
<!-- PDF of a complete dossier, whether it waits for a verification or not. The variables "m" and "layout" hold its DossierPdfModel and its DossierPdfLayout. -->
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fr">
<head th:replace="~{fragments :: head(${m})}">
    <title>Dossier de location</title>
</head>
<body>

<th:block th:replace="~{fragments :: running(${m})}"></th:block>

<div id="cover">
    <div th:replace="~{fragments :: completedCover(${m}, ${layout.namesSize}, ${layout.cardRows})}"></div>
</div>

<th:block th:replace="~{fragments :: content(${m}, ${layout}, ${qrCode}, ${questionnaireUrl})}"></th:block>

</body>
</html>
