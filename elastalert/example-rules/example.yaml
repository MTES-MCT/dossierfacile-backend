name: test-alert

type: any

index: aggregator-logs-%Y.%m.%d   # The index name to search
use_strftime_index: true # Use srtftime to replace the %Y, %m, %d in the index name

#The maximum time between changes. After this time period, ElastAlert 2 will forget the old value of the compare_key field.
timeframe:
  days: 1

filter:
  - match_phrase:
      environment: "preprod"
  - match_phrase:
      application: "api-tenant"
  - match_phrase:
      normalized_uri: "/api/user/deleteAccount"

# Use slack alerter to notify mattermost. The mattermost notifier is not good
alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PREPROD** : Appel détecté sur l'API de suppression de compte"
slack_username_override: "ElastAlert"
slack_emoji_override: ":warning:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  Un appel `{0}` sur l'URI `{1}` a été effectué par l'utilisateur `{2}` (IP : `{3}`) avec le statut `{4}`.
alert_text_args:
  - method
  - normalized_uri
  - user
  - ip
  - response_status

slack_alert_fields:
  - title: Environnement
    value: "environment"
    short: true
  - title: Application
    value: "application"
    short: true
  - title: Méthode
    value: "method"
    short: true
  - title: Statut HTTP
    value: "response_status"
    short: true
  - title: URI
    value: "normalized_uri"
    short: false
  - title: Dernière détection
    value: "@timestamp"
    short: true