name: process-file-monitoring

type: flatline

index: aggregator-logs-%Y.%m.%d
use_strftime_index: true

timeframe:
  hours: 1

threshold: 1  # Moins de 1 hit = alerte

filter:
  - match_phrase:
      environment: "prod"
  - match_phrase:
      application: "process-file"

realert:
  hours: 24  # ⬅️ N’envoie qu’un seul message toutes les 24h

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_elk_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Aucun message sur le service Process-file depuis 1h"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  Aucun événement enregistré sur le service `{0}` (environnement `{1}`) depuis plus d'une heure.
alert_text_args:
  - application
  - environment

slack_alert_fields:
  - title: Environnement
    value: "environment"
    short: true
  - title: Application
    value: "application"
    short: true
  - title: Dernière détection
    value: "@timestamp"
    short: true