name: task-storage-file-deletion

type: flatline

index: aggregator-logs-%Y.%m.%d
use_strftime_index: true

#The maximum time between changes. After this time period, ElastAlert 2 will forget the old value of the compare_key field.
timeframe:
  days: 2

threshold: 1  # Moins de 1 hit = alerte

filter:
  - match_phrase:
      environment: "prod"
  - match_phrase:
      application: "task-scheduler"
  - match_phrase:
      task_name: "STORAGE_FILES_DELETION"
  - match_phrase:
      task_status: "SUCCESS"

realert:
  hours: 24  # ⬅️ N’envoie qu’un seul message toutes les 24h

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_elk_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Aucune suppression de fichiers depuis 2 jours"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  La tâche `STORAGE_FILES_DELETION` de l'application `task-scheduler` n'a enregistré aucun succès en prod sur les 2 derniers jours : les fichiers ne sont plus supprimés du stockage S3.
  Vérifier que le task-scheduler tourne et consulter les dernières exécutions de la tâche via le lien Kibana.
