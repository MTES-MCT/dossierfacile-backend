name: task-tenant-auto-validation-errors
# Per-job error-rate rule for a high-cadence scheduled task (12 runs/hour in prod).
# Fires only when the job fails about 75 % of the time over one hour (9 errors), so isolated
# timeouts (Brevo, OVH, PostgreSQL) never alert while a real outage alerts within minutes.
# Low-cadence jobs (daily, weekly, hourly) stay on task-scheduler-monitoring.yaml (any single error).
type: frequency

index: aggregator-logs-%Y.%m.%d
use_strftime_index: true

num_events: 9
timeframe:
  hours: 1

filter:
  - match_phrase:
      environment: "prod"
  - match_phrase:
      application: "task-scheduler"
  - match_phrase:
      task_status: "ERROR"
  - term:
      task_name.keyword: "TENANT_AUTO_VALIDATION"

realert:
  hours: 24

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_elk_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : la tâche TENANT_AUTO_VALIDATION échoue en continu"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  La tâche `TENANT_AUTO_VALIDATION` de l'application `task-scheduler` a échoué au moins 9 fois dans la dernière heure (environ 12 exécutions par heure en temps normal) : l'auto-validation des dossiers échoue (toutes les 5 min).
  Consulter les dernières exécutions via le lien Kibana.

slack_alert_fields:
  - title: Dernière détection
    value: "@timestamp"
    short: true
