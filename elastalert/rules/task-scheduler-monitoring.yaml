name: task-scheduler-monitoring

type: any

index: aggregator-logs-%Y.%m.%d
use_strftime_index: true

#The maximum time between changes. After this time period, ElastAlert 2 will forget the old value of the compare_key field.
timeframe:
  hours: 1

filter:
  - match_phrase:
      environment: "prod"
  - match_phrase:
      application: "task-scheduler"
  - match_phrase:
      task_status: "ERROR"

query_key: task_name
realert:
  hours: 24  # ⬅️ N’envoie qu’un seul message toutes les 24h

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_elk_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Erreur détectée sur une tâche planifiée"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  La tâche `{0}` de l'application `{1}` a échoué avec le statut `{2}`.
alert_text_args:
  - task_name
  - application
  - task_status

slack_alert_fields:
  - title: Environnement
    value: "environment"
    short: true
  - title: Application
    value: "application"
    short: true
  - title: Tâche
    value: "task_name"
    short: true
  - title: Dernière détection
    value: "@timestamp"
    short: true