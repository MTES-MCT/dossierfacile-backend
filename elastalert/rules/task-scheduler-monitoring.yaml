name: task-scheduler-monitoring

type: any

index: aggregator-logs-%Y.%m.%d
use_strftime_index: true

timeframe:
  hours: 1

filter:
  - match_phrase:
      environment: "prod"
  - match_phrase:
      application: "task-scheduler"
  - match_phrase:
      task_status: "ERROR"
  # High-cadence jobs have their own frequency rule (task-<job>.yaml) with a threshold
  # around 75 % of their hourly runs; here a single error of a daily/weekly/hourly job alerts.
  - bool:
      must_not:
        - terms:
            task_name.keyword:
              - STORAGE_FILES_DELETION
              - STORAGE_FILES_DELETION_RETRY
              - GARBAGE_COLLECTION_V2
              - GARBAGE_COLLECTION
              - SYNCHRONISE_DOCUMENT_IA
              - TENANT_AUTO_VALIDATION
              - CHECK_API_ADEME

query_key: task_name
realert:
  hours: 24  # ⬅️ N’envoie qu’un seul message toutes les 24h

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_elk_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Erreur détectée sur une tâche planifiée"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  La tâche `{0}` de l'application `{1}` a échoué avec le statut `{2}`.
alert_text_args:
  - task_name
  - application
  - task_status

slack_alert_fields:
  - title: Environnement
    value: "environment"
    short: true
  - title: Application
    value: "application"
    short: true
  - title: Tâche
    value: "task_name"
    short: true
  - title: Dernière détection
    value: "@timestamp"
    short: true