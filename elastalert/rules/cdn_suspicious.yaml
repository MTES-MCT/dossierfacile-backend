name: "CDN Suspicious Activity"
# A real mirror site shows up as several distinct visitors loading our assets with the same
# foreign referer. Scanners and bots inject one forged referer per request from a single IP,
# and our own domain sometimes fails the CDN whitelist (missing trailing slash or scheme):
# both would fire a frequency rule, so we count distinct IPs per referer instead.
# Baseline (July to October 2026): max 3 distinct IPs/hour for any referer, so 5 never fires on noise.
type: cardinality
index: cdn-logs-*

cardinality_field: remote_addr.keyword
max_cardinality: 5
timeframe:
  hours: 1

filter:
  - term:
      alert_code.keyword: "CDN_SUSPICIOUS"

query_key: referer.keyword
realert:
  hours: 24

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_cdn_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Site tiers utilisant les assets du CDN"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  Au moins 5 IP distinctes ont chargé des ressources du CDN en 1h avec le referer `{0}` (dernière IP : `{1}`, URI : `{2}`).
  Vérifier si ce domaine héberge une copie du site, puis l'ajouter à la blacklist du CDN si c'est le cas.
alert_text_args:
  - referer
  - remote_addr
  - uri

slack_alert_fields:
  - title: Referer
    value: "referer"
    short: true
  - title: Dernière IP
    value: "remote_addr"
    short: true
  - title: URI
    value: "uri"
    short: true
  - title: Horodatage
    value: "@timestamp"
    short: true
