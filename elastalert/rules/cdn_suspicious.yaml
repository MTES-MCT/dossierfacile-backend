name: "CDN Suspicious Activity"
type: frequency
index: cdn-logs-*

num_events: 1
timeframe:
  hours: 1

filter:
  - term:
      alert_code.keyword: "CDN_SUSPICIOUS"

query_key: referer.keyword
realert:
  hours: 24

alert:
  - slack

slack_webhook_url: "{{mattermost_webhook_cdn_alert_url}}"
slack_msg_color: danger
slack_title: "🚨 **ALERTE PROD** : Activité suspecte détectée sur le CDN"
slack_username_override: "AlerteFacile"
slack_emoji_override: ":no_entry_sign:"

# Empêche ElastAlert de dumper tout le document brut
alert_text_type: alert_text_only

alert_text: |
  **Détail de l'incident** :
  Activité suspecte détectée sur le CDN pour le referer `{0}` (IP : `{1}`, URI : `{2}`).
alert_text_args:
  - referer
  - remote_addr
  - uri

slack_alert_fields:
  - title: Referer
    value: "referer"
    short: true
  - title: IP distante
    value: "remote_addr"
    short: true
  - title: URI
    value: "uri"
    short: true
  - title: Horodatage
    value: "@timestamp"
    short: true